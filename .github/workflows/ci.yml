# CI de PR para development (pipeline-publicacao-f2 RF-01): o pipeline só mescla
# com este check verde.
name: ci

on:
  pull_request:
    branches: [development]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  testes-e-build:
    name: Testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # o prerender do /login exige os dois; valores fictícios, nada é publicado daqui
      NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_CIFICTICIO
      NEXT_PUBLIC_COGNITO_CLIENT_ID: ci-ficticio
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
